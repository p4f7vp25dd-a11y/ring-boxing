<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RING 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0b0d12;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none;color-scheme:dark}
#wrap{display:flex;flex-direction:column;height:100%}
#game{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2}
.bar{width:44%;background:rgba(12,15,24,.86);border:1px solid #232a3b;border-radius:12px;padding:8px}
.name{font-size:11px;font-weight:800;letter-spacing:2px;margin-bottom:6px;white-space:nowrap}
.hp{height:10px;background:#262c3c;border-radius:6px;overflow:hidden;margin-bottom:4px}
.hp>i{display:block;height:100%;width:100%;transition:width .2s}
.st{height:5px;background:#262c3c;border-radius:4px;overflow:hidden}
.st>i{display:block;height:100%;width:100%;background:#f2c94c}
#msg{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:24px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 10px #000;z-index:2;pointer-events:none}
#pause{position:absolute;top:118px;right:10px;z-index:3;background:#1a2030;border:1px solid #3a4256;color:#fff;border-radius:12px;padding:8px 14px;font-weight:800;font-size:13px}
#pad{display:flex;align-items:center;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#0b0d12}
#pad .mv{width:68px;height:62px;border-radius:16px;border:1px solid #3a4256;background:#151a26;color:#fff;font-size:22px;font-weight:800}
#pad .mv.on{background:#2a3350}
#help{flex:1;font-size:11px;color:#9aa3b8;line-height:1.4;text-align:center}
#slip{width:84px;height:62px;border-radius:16px;border:1px solid #35548a;background:#151a26;color:#fff;font-weight:800;font-size:13px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="bar">
        <div class="name" style="color:#ff7a6b">YOU · RED CORNER</div>
        <div class="hp"><i id="hpP" style="background:#e8c15a"></i></div>
        <div class="st"><i id="stP"></i></div>
      </div>
      <div class="bar">
        <div class="name" style="color:#8fb8ff">CPU · BLUE CORNER</div>
        <div class="hp"><i id="hpC" style="background:linear-gradient(90deg,#6fb6ff,#8b7bff)"></i></div>
        <div class="st"><i id="stC"></i></div>
      </div>
    </div>
    <div id="msg"></div>
    <button id="pause">II ПАУЗА</button>
  </div>
  <div id="pad">
    <button class="mv" data-d="-1">◀</button>
    <button class="mv" data-d="1">▶</button>
    <div id="help">Тап — джеб · свайп вправо — кросс · влево — хук · вверх — апперкот · вниз — корпус · держать — блок</div>
    <button id="slip">УКЛОН</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const SKIN = '#d9a27a', HAIR = '#2a1c14', BOOT = '#151515';
const KEYS = ['lean','ht','hs','lSA','lFA','rSA','rFA','lTA','lSh','rTA','rSh'];

// Poses. Arm angles are absolute: 0 = hanging down, positive = forward. Legs likewise.
const G   = {lean:0.12, ht:0, hs:0, lSA:0.6, lFA:3.0, rSA:0.15, rFA:2.7, lTA:0.3, lSh:0.1, rTA:-0.3, rSh:-0.15};
const BLK = {lean:0.02, ht:-0.1, hs:0, lSA:0.96, lFA:3.1, rSA:0.7, rFA:2.9, lTA:0.3, lSh:0.1, rTA:-0.3, rSh:-0.15};

const ATK = {
  jab:   {fist:'lF', zone:'head', dmg:7,  cost:6,  wd:0.08, ed:0.07,
          wind:{lSA:0.3, lFA:2.4, lean:-0.06},
          ext: {lSA:1.5, lFA:1.5, lean:0.2, ht:0.1}},
  cross: {fist:'rF', zone:'head', dmg:12, cost:10, wd:0.11, ed:0.08,
          wind:{rSA:0.4, rFA:2.2, lean:-0.12, rTA:-0.2},
          ext: {rSA:1.5, rFA:1.48, lean:0.32, ht:0.15, rTA:-0.45, rSh:-0.2}},
  hook:  {fist:'lF', zone:'head', dmg:11, cost:10, wd:0.12, ed:0.09,
          wind:{lSA:0.2, lFA:2.3, lean:-0.12},
          ext: {lSA:1.3, lFA:2.0, lean:0.18, ht:-0.05}},
  body:  {fist:'lF', zone:'body', dmg:8, cost:8,  wd:0.09, ed:0.08,
          wind:{lSA:0.5, lFA:2.6, lean:-0.05},
          ext: {lSA:1.05, lFA:1.3, lean:0.35, ht:0.2, lTA:0.5}},
  upper: {fist:'rF', zone:'head', dmg:13, cost:12, wd:0.14, ed:0.10,
          wind:{rSA:0.1, rFA:0.3, lean:-0.15, rTA:-0.25, rSh:-0.3},
          ext: {rSA:0.75, rFA:2.9, lean:0.3, rTA:-0.2, rSh:-0.25, lTA:0.4}}
};

// ---------- helpers ----------
const copyP = p => Object.assign({}, p);
const lerpP = (a, b, t) => { const o = {}; for (const k of KEYS) o[k] = a[k] + (b[k] - a[k]) * t; return o; };
const ease = k => k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const stance = f => f.block ? BLK : G;
const merge = (f, o) => Object.assign({}, stance(f), o);
const busy = f => !!(f.tr || f.seq.length);
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const showMsg = (t, dur) => { $('msg').textContent = t; msgT = dur; };

// ---------- state ----------
let W = 0, H = 0, FOCAL = 1, time = 0, shake = 0, state = 'fight', downF = null, downT = 0, koT = 0, msgT = 0;
let paused = false, thinkT = 0, blockT = 0, moveHold = 0, pivotX = 0;
const YAW = 0.22, CAM_D = 6.2;     // camera angle and distance
function makeFighter(dir, ph, col, glove) {
  return {dir, ph, col, glove, x: 0, hp: 100, st: 100, cur: copyP(G), tr: null, seq: [],
          block: false, stepT: 0, vx: 0, dodgeT: 0, fall: 0, down: false};
}
const P1 = makeFighter(1, 0, '#b8322a', '#e74c3c');
const C  = makeFighter(-1, 2.3, '#2456a8', '#3b82f6');

// ---------- skeleton in 3D: x = forward, y = up, z = side (lead arm/leg toward camera) ----------
// Returns world-space joint positions {x,y,z} for the fighter.
function worldPts(f) {
  const p = f.cur, lean = p.lean + Math.sin(time * 2.4 + f.ph) * 0.025;
  const footL = -(0.46 * Math.cos(p.lTA) + 0.45 * Math.cos(p.lSh));
  const footR = -(0.46 * Math.cos(p.rTA) + 0.45 * Math.cos(p.rSh));
  const hipY = -Math.min(footL, footR);
  const pt = (o, len, a, z) => ({x: o.x + len * Math.sin(a), y: o.y - len * Math.cos(a), z});
  const hip = {x: p.hs, y: hipY, z: 0};
  const kL = pt(hip, 0.46, p.lTA, 0.08), aL = pt(kL, 0.45, p.lSh, 0.08);
  const kR = pt(hip, 0.46, p.rTA, -0.08), aR = pt(kR, 0.45, p.rSh, -0.08);
  const chest = {x: hip.x + 0.52 * Math.sin(lean), y: hip.y + 0.52 * Math.cos(lean), z: 0};
  const head = {x: chest.x + 0.15 * Math.sin(lean + p.ht), y: chest.y + 0.15 * Math.cos(lean + p.ht), z: 0};
  const lE = pt(chest, 0.34, p.lSA, 0.11), lF = pt(lE, 0.31, p.lFA, 0.11);
  const rE = pt(chest, 0.34, p.rSA, -0.11), rF = pt(rE, 0.31, p.rFA, -0.11);
  const P = {hip, kL, aL, kR, aR, chest, head, lE, lF, rE, rF};

  if (f.fall > 0) {                      // knockdown: tip backward around the hips
    const th = f.fall * Math.PI / 2, c = Math.cos(th), s = Math.sin(th);
    let minY = 1e9;
    for (const k in P) {
      const dx = P[k].x - hip.x, dy = P[k].y - hip.y;
      P[k] = {x: hip.x + dx * c - dy * s, y: hip.y + dx * s + dy * c, z: P[k].z};
      minY = Math.min(minY, P[k].y);
    }
    for (const k in P) P[k].y -= minY;
  }
  for (const k in P) P[k] = {x: f.x + f.dir * P[k].x, y: P[k].y, z: P[k].z};
  return P;
}

// ---------- projection (simple perspective camera, slightly rotated around the ring centre) ----------
function project(p) {
  const x = p.x - pivotX, c = Math.cos(YAW), s = Math.sin(YAW);
  const xr = x * c + p.z * s, zr = -x * s + p.z * c;
  const d = CAM_D - zr, k = FOCAL / d;
  return {x: W / 2 + xr * k, y: H * 0.6 - (p.y - 0.95) * k, d, k};
}

let items = [];
function part(a, b, r, col) {
  const A = project(a), B = project(b);
  items.push({d: (A.d + B.d) / 2, kind: 0, A, B, r, col});
}
function dot(p, r, col) {
  const A = project(p);
  items.push({d: A.d, kind: 1, A, r, col});
}
function drawFighter(f) {
  const P = worldPts(f);
  // back leg, back arm, torso, head, front leg, front arm
  part(P.hip, P.kR, 0.085, f.col); part(P.kR, P.aR, 0.065, SKIN); dot(P.aR, 0.05, BOOT);
  part(P.chest, P.rE, 0.055, SKIN); part(P.rE, P.rF, 0.05, SKIN); dot(P.rF, 0.1, f.glove);
  part(P.hip, P.chest, 0.13, SKIN); dot(P.hip, 0.13, f.col);
  dot({x: P.head.x, y: P.head.y + 0.08, z: P.head.z}, 0.11, HAIR);
  dot(P.head, 0.14, SKIN);
  part(P.hip, P.kL, 0.085, f.col); part(P.kL, P.aL, 0.065, SKIN); dot(P.aL, 0.05, BOOT);
  part(P.chest, P.lE, 0.055, SKIN); part(P.lE, P.lF, 0.05, SKIN); dot(P.lF, 0.1, f.glove);
}

function drawRing() {
  const pts = (x, y, z) => project({x, y, z});
  // canvas floor
  const corners = [[-2.5, -2.5], [2.5, -2.5], [2.5, 2.5], [-2.5, 2.5]].map(([x, z]) => pts(x, 0, z));
  ctx.fillStyle = '#2d3341';
  ctx.beginPath(); corners.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath(); ctx.fill();
  // posts
  ctx.strokeStyle = '#555c6e'; ctx.lineWidth = 4;
  for (const [x, z] of [[-2.5, -2.5], [2.5, -2.5], [-2.5, 2.5], [2.5, 2.5]]) {
    const a = pts(x, 0, z), b = pts(x, 1.45, z);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // ropes on back, left and right sides
  const ropeCols = ['#e74c3c', '#f2f2f2', '#3b82f6'], hs = [0.45, 0.8, 1.15];
  hs.forEach((h, i) => {
    ctx.strokeStyle = ropeCols[i]; ctx.lineWidth = 3;
    const segs = [[[-2.5, h, -2.5], [2.5, h, -2.5]], [[-2.5, h, -2.5], [-2.5, h, 2.5]], [[2.5, h, -2.5], [2.5, h, 2.5]]];
    for (const [a, b] of segs) {
      const A = pts(a[0], a[1], a[2]), B = pts(b[0], b[1], b[2]);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
  });
  // contact shadows
  for (const f of [P1, C]) {
    const c = pts(f.x, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 60 * c.k * 0.01 * 10, 9 * c.k * 0.01 * 10, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const jx = shake > 0 ? (Math.random() - 0.5) * shake : 0, jy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(1, 0, 0, 1, jx, jy);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d111c'); g.addColorStop(1, '#1d2233');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  drawRing();

  items = [];
  drawFighter(C); drawFighter(P1);
  items.sort((a, b) => b.d - a.d);   // far first
  for (const it of items) {
    if (it.kind === 0) {
      ctx.strokeStyle = it.col; ctx.lineCap = 'round';
      ctx.lineWidth = 2 * it.r * (it.A.k + it.B.k) / 2;
      ctx.beginPath(); ctx.moveTo(it.A.x, it.A.y); ctx.lineTo(it.B.x, it.B.y); ctx.stroke();
    } else {
      ctx.fillStyle = it.col;
      ctx.beginPath(); ctx.arc(it.A.x, it.A.y, it.r * it.A.k, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ---------- animation core ----------
function tick(f, dt) {
  f.stepT = Math.max(0, f.stepT - dt);
  if (f.stepT > 0) f.x += f.vx * dt;
  f.dodgeT = Math.max(0, f.dodgeT - dt);
  f.st = Math.min(100, f.st + (busy(f) ? 3 : 12) * dt);
  if (f.tr) {
    f.tr.t += dt;
    const k = Math.min(1, f.tr.t / f.tr.dur);
    f.cur = lerpP(f.tr.from, f.tr.to, ease(k));
    if (k >= 1) {
      const h = f.tr.hit;
      f.tr = null;
      if (h) resolve(f, h);
    }
  }
  if (!f.tr && f.seq.length) {
    const n = f.seq.shift();
    const to = typeof n.to === 'function' ? n.to() : n.to;
    f.tr = {from: copyP(f.cur), to, dur: n.dur, t: 0, hit: n.hit};
  }
  f.x = clamp(f.x, -1.9, 1.9);
}

function doAttack(f, k) {
  if (state !== 'fight' || f.down || busy(f) || f.stepT > 0 || f.block) return;
  const a = ATK[k], sp = f.st < 25 ? 1.35 : 1;
  f.st = Math.max(0, f.st - a.cost);
  f.seq = [
    {to: () => merge(f, a.wind), dur: a.wd * sp},
    {to: () => merge(f, a.ext),  dur: a.ed * sp, hit: k},
    {to: () => stance(f), dur: 0.25 * sp}
  ];
}

function step(f, dir) {
  if (state !== 'fight' || f.down || busy(f) || f.stepT > 0 || f.block) return;
  const fwd = dir * f.dir;
  const sp = fwd > 0 ? {lTA: 0.6, lSh: 0.25, rTA: -0.2, rSh: -0.3}
                     : {lTA: 0.0, lSh: -0.1, rTA: -0.55, rSh: -0.3};
  f.seq = [{to: () => merge(f, sp), dur: 0.1}, {to: () => stance(f), dur: 0.14}];
  f.stepT = 0.24; f.vx = dir * 0.35 / 0.24;
}

function slip(f) {
  if (state !== 'fight' || f.down || busy(f) || f.block) return;
  f.dodgeT = 0.35;
  f.seq = [{to: () => merge(f, {lean: -0.22, ht: 0.35, hs: -0.06}), dur: 0.09},
           {to: () => stance(f), dur: 0.3}];
}

function setBlock(v) {
  P1.block = v;
  if (!busy(P1)) P1.seq = [{to: () => stance(P1), dur: 0.1}];
}

function resolve(a, k) {
  const d = ATK[k], t = a === P1 ? C : P1;
  const fp = worldPts(a)[d.fist];
  const TP = worldPts(t);
  const hp = TP.head, bp = {x: (TP.hip.x + TP.chest.x) / 2, y: (TP.hip.y + TP.chest.y) / 2, z: 0};
  let zone = null;
  if (d.zone === 'head' && dist3(fp, hp) < 0.26) zone = 'head';
  if (d.zone === 'body' && dist3(fp, bp) < 0.3) zone = 'body';
  if (!zone) { showMsg('МИМО', 0.4); return; }
  if (zone === 'head' && t.dodgeT > 0) { showMsg('УКЛОН!', 0.6); return; }
  if (t.block && zone === 'head') {
    showMsg('БЛОК', 0.6);
    t.seq = [{to: () => merge(t, {lean: 0.04}), dur: 0.05}, {to: () => stance(t), dur: 0.2}];
    return;
  }
  let dmg = d.dmg, react;
  if (zone === 'head') {
    react = {lean: -0.22, ht: -0.45, hs: -0.06}; shake = Math.max(shake, 7);
    showMsg('ПОПАДАНИЕ', 0.6);
  } else {
    react = {lean: 0.42, ht: 0.25}; shake = Math.max(shake, 3);
    showMsg('КОРПУС', 0.6);
    if (t.block) dmg *= 0.35;
  }
  t.hp = Math.max(0, t.hp - dmg);
  t.tr = null;
  t.seq = [{to: () => merge(t, react), dur: 0.07}, {to: () => stance(t), dur: 0.35}];
  t.x += a.dir * 0.12;
  if (t.hp <= 0) startKnockdown(t);
}

function startKnockdown(t) {
  state = 'down'; downF = t; downT = 0;
  t.down = true; t.seq = []; t.tr = null; t.block = false;
}

// ---------- CPU ----------
function ai(dt) {
  if (C.block && (blockT -= dt) <= 0) {
    C.block = false;
    if (!busy(C)) C.seq = [{to: () => G, dur: 0.15}];
  }
  thinkT -= dt;
  if (thinkT > 0) return;
  thinkT = 0.45 + Math.random() * 0.6;
  if (busy(C) || C.stepT > 0 || C.down) return;
  const d = Math.abs(C.x - P1.x);
  if (P1.tr && P1.tr.hit && d < 1.1 && Math.random() < 0.35) {
    C.block = true; blockT = 0.45; C.seq = [{to: () => BLK, dur: 0.08}]; return;
  }
  if (d > 0.92) { step(C, P1.x > C.x ? 1 : -1); return; }
  const r = Math.random();
  if (r < 0.45) {
    const ks = ['jab', 'jab', 'cross', 'hook', 'body', 'upper'];
    doAttack(C, ks[Math.floor(Math.random() * ks.length)]);
  } else if (r < 0.6) {
    C.block = true; blockT = 0.6; C.seq = [{to: () => BLK, dur: 0.08}];
  } else if (r < 0.75 && d < 0.7) {
    step(C, P1.x > C.x ? -1 : 1);
  } else {
    slip(C);
  }
}

// ---------- round flow ----------
function separate() {
  const d = C.x - P1.x, min = 0.5;
  if (Math.abs(d) < min) {
    const m = (min - Math.abs(d)) / 2 * Math.sign(d || 1);
    P1.x -= m; C.x += m;
  }
}

function newRound() {
  for (const f of [P1, C]) {
    f.hp = 100; f.st = 100; f.fall = 0; f.down = false; f.block = false;
    f.seq = []; f.tr = null; f.stepT = 0; f.dodgeT = 0; f.cur = copyP(G);
  }
  P1.x = -0.4; C.x = 0.4;
  state = 'fight'; downF = null;
  showMsg('РАУНД 1', 1.2);
}

// ---------- frame ----------
function frame(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 30);
  if (msgT > 0 && (msgT -= dt) <= 0 && state === 'fight') $('msg').textContent = '';

  if (state === 'fight' && !paused) {
    if (moveHold && !busy(P1) && P1.stepT <= 0 && !P1.block) step(P1, moveHold);
    tick(P1, dt); tick(C, dt); ai(dt); separate();
  } else if (state === 'down') {
    downT += dt;
    downF.fall = Math.min(1, downT / 0.8);
    if (downT >= 0.8) showMsg('СЧЁТ ' + Math.min(10, Math.floor(downT - 0.8) + 1), 0.2);
    if (downT >= 9.8) {
      state = 'ko'; koT = 3;
      showMsg('KNOCKDOWN · ' + (downF === P1 ? 'CPU WINS' : 'YOU WIN'), 99);
    }
  } else if (state === 'ko') {
    koT -= dt;
    if (koT <= 0) newRound();
  }
  pivotX = (P1.x + C.x) / 2;
  $('hpP').style.width = P1.hp + '%';
  $('hpC').style.width = C.hp + '%';
  $('stP').style.width = P1.st + '%';
  $('stC').style.width = C.st + '%';
}

function resize() {
  const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  FOCAL = Math.min(H * 1.55, W * 2.7);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  frame(dt);
  render();
  requestAnimationFrame(loop);
}

// ---------- controls ----------
// Arena gestures: tap = jab, swipe right = cross, left = hook, up = uppercut, down = body, hold = block.
let g = null;
cv.addEventListener('pointerdown', e => {
  if (g) return;
  g = {id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
       t0: performance.now(), moved: false, blocked: false, bt: null};
  g.bt = setTimeout(() => {
    if (g && !g.moved) { g.blocked = true; setBlock(true); }
  }, 320);
});
cv.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id) return;
  g.x = e.clientX; g.y = e.clientY;
  if (Math.hypot(g.x - g.x0, g.y - g.y0) > 24) { g.moved = true; clearTimeout(g.bt); }
});
const endGesture = e => {
  if (!g || e.pointerId !== g.id) return;
  clearTimeout(g.bt);
  const dx = g.x - g.x0, dy = g.y - g.y0, dt = performance.now() - g.t0;
  if (g.blocked) setBlock(false);
  else if (Math.hypot(dx, dy) > 45 && dt < 500) {
    if (Math.abs(dx) > Math.abs(dy)) doAttack(P1, dx > 0 ? 'cross' : 'hook');
    else doAttack(P1, dy < 0 ? 'upper' : 'body');
  } else if (!g.moved && dt < 320) doAttack(P1, 'jab');
  g = null;
};
cv.addEventListener('pointerup', endGesture);
cv.addEventListener('pointercancel', endGesture);

document.querySelectorAll('#pad .mv').forEach(b => {
  const d = Number(b.dataset.d);
  b.addEventListener('pointerdown', e => { e.preventDefault(); moveHold = d; b.classList.add('on'); });
  const stop = () => { if (moveHold === d) moveHold = 0; b.classList.remove('on'); };
  b.addEventListener('pointerup', stop);
  b.addEventListener('pointerleave', stop);
  b.addEventListener('pointercancel', stop);
});
$('slip').addEventListener('pointerdown', e => { e.preventDefault(); slip(P1); });

$('pause').addEventListener('click', () => {
  if (state === 'ko') return;
  paused = !paused;
  $('pause').textContent = paused ? '▶ ИГРАТЬ' : 'II ПАУЗА';
  if (paused) showMsg('ПАУЗА', 99); else showMsg('', 0);
});

// ---------- start ----------
window.addEventListener('resize', resize);
resize();
newRound();
requestAnimationFrame(loop);
</script>
